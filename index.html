<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a0405" />
    <title>Shik Shak Shok · Stands</title>
    <meta name="description" content="شيك شك شوك في إسبري — les tickets sont disponibles dans les stands (Bloc A, G, ESB)." />
  </head>
  <body>
    <canvas id="bg3d" aria-hidden="true"></canvas>
    <div class="curtain-edge curtain-left" aria-hidden="true"></div>
    <div class="curtain-edge curtain-right" aria-hidden="true"></div>
    <div class="smoke" aria-hidden="true"></div>

    <div id="intro" aria-label="Introduction"></div>

    <main>
      <header id="hero">
        <div class="arch">
          <h1 class="title">
            <img class="title-img" src="./assets/title.webp" alt="شيك شك شوك في إسبري" width="1200" height="469" />
          </h1>
          <p class="tagline-ar" lang="ar" dir="rtl">فاش تستنّاو؟</p>
          <ul class="event-chips" id="event-line">
            <li><i data-icon="calendar"></i><bdi>2 ديسمبر 2026</bdi></li>
            <li><i data-icon="clock"></i><bdi>20h</bdi></li>
            <li><a class="event-map" href="https://www.google.com/maps/search/?api=1&amp;query=ESPRIT%20Ghazela%20Ariana%20Tunisie" target="_blank" rel="noopener noreferrer"><i data-icon="pin"></i><bdi>ESPRIT Bloc E</bdi></a></li>
          </ul>
        </div>
        <div class="taglines">
          <p class="tagline"><i data-icon="ticket"></i> Les tickets sont disponibles dans les stands</p>
          <p class="tagline tagline-music"><i data-icon="music"></i> Check the blocs, follow the music <i data-icon="music"></i></p>
        </div>
        <a class="scroll-cue" href="#stands-section" aria-label="Voir les stands">⌄</a>
      </header>

      <section id="stands-section">
        <h2 class="section-title">
          <span class="ar" lang="ar">لمعرفة نقاط البيع</span>
          <span class="fr">Les stands &amp; tickets</span>
        </h2>
        <div id="stands" class="stands-grid"></div>
      </section>

      <section id="contact"></section>
    </main>

    <footer>
      <img class="esprit-logo" src="./assets/esprit-light.png" alt="ESPRIT Student Committee" width="420" height="110" />
      <p class="footer-note">Organisé par le Comité des étudiants ESPRIT · Shik Shak Shok</p>
      <p class="credit">Made by <span class="credit-name">Youssef Abbes</span></p>
    </footer>


    <script type="module" src="/src/main.js"></script>
  </body>
</html>
