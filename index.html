<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a0405" />
    <title>Shik Shak Shok · Stands</title>
    <meta name="description" content="شيك شك شوك في إسبري — trouve le stand de ton bloc, les tickets sont là-bas." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@500;700&family=Poppins:wght@400;600;700&family=Cinzel:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="bg3d" aria-hidden="true"></canvas>
    <div class="curtain-edge curtain-left" aria-hidden="true"></div>
    <div class="curtain-edge curtain-right" aria-hidden="true"></div>
    <div class="smoke" aria-hidden="true"></div>

    <div id="intro" aria-label="Introduction"></div>

    <main>
      <header id="hero">
        <div class="arch">
          <h1 class="title">
            <img class="title-img" src="./assets/title.webp" alt="شيك شك شوك في إسبري" width="1200" height="467" />
          </h1>
          <p class="tagline-en">An Oriental Celebration</p>
          <ul class="event-chips" id="event-line">
            <li><span aria-hidden="true">📅</span><bdi>2 ديسمبر 2026</bdi></li>
            <li><span aria-hidden="true">🕗</span><bdi>20h</bdi></li>
            <li><span aria-hidden="true">📍</span><bdi>ESPRIT Bloc E</bdi></li>
          </ul>
        </div>
        <div class="taglines">
          <p class="tagline">Chaque bloc a son stand — les tickets sont là-bas 🎟️</p>
          <p class="tagline tagline-music">Check the blocs, follow the music 🎶</p>
        </div>
        <a class="scroll-cue" href="#stands-section" aria-label="Voir les stands">⌄</a>
      </header>

      <section id="stands-section">
        <h2 class="section-title">
          <span class="ar" lang="ar">لمعرفة نقاط البيع</span>
          <span class="fr">Les stands &amp; tickets</span>
        </h2>
        <div id="stands" class="stands-grid"></div>
      </section>

      <section id="contact"></section>
    </main>

    <footer>
      <img class="esprit-logo" src="./assets/esprit-light.png" alt="ESPRIT Student Committee" width="420" height="110" />
      <p class="footer-note">Organisé par le Comité des étudiants ESPRIT · Shik Shak Shok 💃</p>
    </footer>

    <button id="sound-toggle" class="sound-toggle" type="button" aria-label="Musique" hidden>🔊</button>
    <audio id="music" src="./assets/music.mp3" loop preload="none"></audio>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
